[project]
name = "little-joys-creators"
version = "0.1.0"
description = "Evidence-based creator selection and briefs for Little Joys (Galvor take-home)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas>=2.2,<3.0.0",
    "numpy>=1.26,<3.0.0",
    "statsmodels>=0.15.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.17.3",
]
audit = ["imageio-ffmpeg>=0.5", "pillow>=10"]
app = [
    "streamlit>=1.66.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lj"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
# Report writers hold long prose strings; the formatter keeps code itself within 120 characters.
ignore = ["E501"]
